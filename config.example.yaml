server:
  host: 127.0.0.1
  port: 8765
  launch_at_login: false
  close_to_tray: true
  codex_official_proxy_url: ""
  native_codex_base_url: https://chatgpt.com/backend-api/codex
  native_stream_timeout: 600
  # Disabled by default. When enabled, LAN BRIDGE reads the bridge host's
  # file-based Codex login; clients authenticate with a managed bridge key.
  native_auth_injection:
    enabled: false
    auth_file: "" # auto-detect %CODEX_HOME%/auth.json or %USERPROFILE%/.codex/auth.json

# The bridge issues and stores hashes of client access keys in a separate local
# file. The raw key is shown only once when it is created or rotated in the
# desktop manager. With no enabled key, /v1 fails closed while the loopback-only
# management UI remains available to create the first key. Do not put keys here.
access_control:
  enabled: true
  # store_path: "" # optional; default: %USERPROFILE%/.lan-bridge/access-keys.json

providers:
  qwen:
    adapter: qwen
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: QWEN_API_KEY
  deepseek:
    adapter: deepseek
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
  kimi:
    adapter: kimi
    base_url: https://api.moonshot.cn/v1
    api_key_env: KIMI_API_KEY
  openai-compatible:
    adapter: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY

model_mapping:
  gpt-5-code:
    target: qwen-plus
    provider: qwen
    is_multimodal: false
    vision_alias: null
  gpt-5-code-light:
    target: qwen-turbo
    provider: qwen
    is_multimodal: false
    vision_alias: null

  # WorkBuddy continues to call /v1/chat/completions, while this alias uses
  # the configured upstream Responses endpoint. The two protocol fields are
  # explicit; the bridge never infers them from the model name.
  gpt-5.6-terra-wb-responses:
    display_name: GPT-5.6 Terra (WorkBuddy Responses)
    target: gpt-5.6-terra
    upstream_model: gpt-5.6-terra
    provider: openai-compatible
    inbound_protocol: chat_completions
    upstream_protocol: responses
    wire_api: responses
    enabled: true
    is_multimodal: true
    is_reasoning_text: true
    capabilities:
      reasoning: true
      image_input: true
      parallel_tool_calls: true
      reasoning_efforts: [low, medium, high, xhigh]

web_search:
  enabled: false
  active_provider: bocha
  max_rounds: 3
  providers:
    bocha:
      adapter: bocha
      display_name: Bocha Web Search
      base_url: https://api.bocha.cn/v1/web-search
      api_key_env: BOCHA_API_KEY
      enabled: true
      timeout: 30
      max_results: 5
      summary: true
      freshness: noLimit
