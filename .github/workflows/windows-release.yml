name: Windows desktop release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and VERSION differ.' }
      - name: Test, build and verify the complete desktop
        shell: pwsh
        run: ./scripts/windows.ps1 -Action Build
      - uses: actions/upload-artifact@v4
        with:
          name: LAN-BRIDGE-Windows-x64
          path: |
            agent/output/windows/*.exe
            agent/output/windows/SHA256SUMS.txt
      - name: Publish verified desktop assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem agent/output/windows/*.exe | ForEach-Object FullName)
          $assets += (Resolve-Path agent/output/windows/SHA256SUMS.txt).Path
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "LAN BRIDGE $env:GITHUB_REF_NAME" --notes 'Windows x64 desktop. Install the Setup executable. The other executable is the same desktop in portable form. Read README.md and docs/WINDOWS.md for setup and Codex login.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
