appId: com.lan-bridge.app
productName: LAN BRIDGE
copyright: MIT

directories:
  output: ../agent/output/windows
  buildResources: assets

beforePack: scripts/verify-backend.cjs
afterPack: scripts/verify-backend.cjs

files:
  - dist/**/*
  - dist-electron/**/*

extraResources:
  - from: ../dist-backend/
    to: backend/
  - from: assets/
    to: assets/
  - from: recovery/
    to: recovery/

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: LAN BRIDGE

win:
  target:
    - nsis
    - portable
  icon: assets/icon.ico
  signExecutable: false
